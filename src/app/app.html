<div class="shell">
  <header class="shell-header">
    <div style="flex:1;min-width:0">
      <div class="sheet-kicker">Finanzas · local</div>
      <div style="font-family:var(--font-heading);font-weight:600;font-size:24px;line-height:1.05">{{ title() }}</div>
    </div>
    <a routerLink="/avisos" style="position:relative;width:40px;height:40px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;border:1px solid var(--color-divider);color:var(--color-text)" aria-label="Avisos">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M6 8a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6"></path><path d="M10.3 20a2 2 0 0 0 3.4 0"></path></svg>
      @if (pendingCount() > 0) {
        <span style="position:absolute;top:-1px;right:-1px;min-width:16px;height:16px;padding:0 3px;display:flex;align-items:center;justify-content:center;background:var(--color-accent);color:var(--color-bg);font-family:var(--font-heading);font-weight:600;font-size:11px;line-height:1">{{ pendingCount() }}</span>
      }
    </a>
  </header>

  <main class="shell-main">
    @if (store.ready()) {
      <router-outlet></router-outlet>
    }
  </main>

  <nav class="shell-tabs">
    @for (t of tabs; track t.path) {
      <a class="shell-tab" [routerLink]="t.path" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: t.path === '/' }">{{ t.label }}</a>
    }
  </nav>
</div>

<app-add-tx-sheet></app-add-tx-sheet>
<app-account-sheet></app-account-sheet>
<app-sub-sheet></app-sub-sheet>
<app-goal-sheet></app-goal-sheet>

@if (sheet.toast(); as t) {
  <div class="toast">{{ t }}</div>
}
